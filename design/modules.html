<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0;padding:0;background:#f5f0e4;}
  svg{display:block;font-family:"Microsoft YaHei","PingFang SC",sans-serif;}
</style>
</head>
<body>
<svg width="1600" height="760" viewBox="0 0 1600 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f2e7"/>
      <stop offset="1" stop-color="#f1ebdc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3a332a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1600" height="760" fill="url(#paper)"/>

  <!-- Title -->
  <text x="46" y="52" font-size="30" font-weight="700" fill="#2a2723" font-family="KaiTi,STKaiti,serif">墨影 · 功能模块图</text>
  <rect x="330" y="30" width="34" height="34" rx="4" fill="#b5443a"/>
  <text x="347" y="54" font-size="20" fill="#f7f2e7" text-anchor="middle" font-family="KaiTi,STKaiti,serif">影</text>

  <!-- ===== connectors ===== -->
  <!-- root down to bus -->
  <g stroke="#a89f90" stroke-width="1.6" fill="none">
    <line x1="800" y1="139" x2="800" y2="170"/>
    <line x1="180" y1="170" x2="1380" y2="170"/>
    <line x1="180" y1="170" x2="180" y2="183"/>
    <line x1="480" y1="170" x2="480" y2="183"/>
    <line x1="780" y1="170" x2="780" y2="183"/>
    <line x1="1080" y1="170" x2="1080" y2="183"/>
    <line x1="1380" y1="170" x2="1380" y2="183"/>
  </g>
  <!-- vertical column connector lines -->
  <g stroke="#c7bfae" stroke-width="1.4">
    <line x1="180" y1="263" x2="180" y2="517"/>
    <line x1="480" y1="263" x2="480" y2="597"/>
    <line x1="780" y1="263" x2="780" y2="517"/>
    <line x1="1080" y1="263" x2="1080" y2="517"/>
    <line x1="1380" y1="263" x2="1380" y2="517"/>
  </g>

  <!-- ===== root ===== -->
  <g filter="url(#shadow)">
    <rect x="620" y="75" width="360" height="64" rx="12" fill="#2a2723"/>
  </g>
  <text x="800" y="114" font-size="19" fill="#f7f2e7" text-anchor="middle" font-weight="600">墨影 · AI 自媒体文案工作台</text>

  <!-- ===== categories ===== -->
  <!-- col1 身份与资产 slate -->
  <g filter="url(#shadow)">
    <rect x="60" y="183" width="240" height="56" rx="10" fill="#4a5a6e"/>
  </g>
  <text x="180" y="217" font-size="17" fill="#f7f2e7" text-anchor="middle" font-weight="600">身份与资产</text>
  <!-- col2 创作流水线 teal -->
  <g filter="url(#shadow)">
    <rect x="360" y="183" width="240" height="56" rx="10" fill="#3f5e58"/>
  </g>
  <text x="480" y="217" font-size="17" fill="#f7f2e7" text-anchor="middle" font-weight="600">创作流水线</text>
  <!-- col3 热点借势 ochre -->
  <g filter="url(#shadow)">
    <rect x="660" y="183" width="240" height="56" rx="10" fill="#9a6b3f"/>
  </g>
  <text x="780" y="217" font-size="17" fill="#f7f2e7" text-anchor="middle" font-weight="600">热点借势</text>
  <!-- col4 成稿后处理 mauve -->
  <g filter="url(#shadow)">
    <rect x="960" y="183" width="240" height="56" rx="10" fill="#6d5a75"/>
  </g>
  <text x="1080" y="217" font-size="17" fill="#f7f2e7" text-anchor="middle" font-weight="600">成稿后处理</text>
  <!-- col5 平台与质量 bamboo -->
  <g filter="url(#shadow)">
    <rect x="1260" y="183" width="240" height="56" rx="10" fill="#55705c"/>
  </g>
  <text x="1380" y="217" font-size="17" fill="#f7f2e7" text-anchor="middle" font-weight="600">平台与质量</text>

  <!-- ===== children ===== -->
  <!-- col1 -->
  <g filter="url(#shadow)">
    <rect x="60" y="293" width="240" height="54" rx="9" fill="#eef1f4" stroke="#4a5a6e" stroke-width="1.4"/>
    <rect x="60" y="373" width="240" height="54" rx="9" fill="#eef1f4" stroke="#4a5a6e" stroke-width="1.4"/>
    <rect x="60" y="453" width="240" height="54" rx="9" fill="#eef1f4" stroke="#4a5a6e" stroke-width="1.4"/>
  </g>
  <text x="180" y="326" font-size="16" fill="#2a2723" text-anchor="middle">个人人设</text>
  <text x="180" y="406" font-size="16" fill="#2a2723" text-anchor="middle">账号设定</text>
  <text x="180" y="486" font-size="15" fill="#2a2723" text-anchor="middle">栏目 / 语气 / 选题池 / 稿库</text>

  <!-- col2 -->
  <g filter="url(#shadow)">
    <rect x="360" y="293" width="240" height="54" rx="9" fill="#e9efec" stroke="#3f5e58" stroke-width="1.4"/>
    <rect x="360" y="373" width="240" height="54" rx="9" fill="#e9efec" stroke="#3f5e58" stroke-width="1.4"/>
    <rect x="360" y="453" width="240" height="54" rx="9" fill="#e9efec" stroke="#3f5e58" stroke-width="1.4"/>
    <rect x="360" y="533" width="240" height="54" rx="9" fill="#e9efec" stroke="#3f5e58" stroke-width="1.4"/>
  </g>
  <text x="480" y="326" font-size="16" fill="#2a2723" text-anchor="middle">选题材</text>
  <text x="480" y="406" font-size="16" fill="#2a2723" text-anchor="middle">三个方向</text>
  <text x="480" y="486" font-size="16" fill="#2a2723" text-anchor="middle">流式成稿</text>
  <text x="480" y="566" font-size="16" fill="#2a2723" text-anchor="middle">局部改写</text>

  <!-- col3 -->
  <g filter="url(#shadow)">
    <rect x="660" y="293" width="240" height="54" rx="9" fill="#f6ede1" stroke="#9a6b3f" stroke-width="1.4"/>
    <rect x="660" y="373" width="240" height="54" rx="9" fill="#f6ede1" stroke="#9a6b3f" stroke-width="1.4"/>
    <rect x="660" y="453" width="240" height="54" rx="9" fill="#f6ede1" stroke="#9a6b3f" stroke-width="1.4"/>
  </g>
  <text x="780" y="326" font-size="16" fill="#2a2723" text-anchor="middle">六源热榜</text>
  <text x="780" y="406" font-size="16" fill="#2a2723" text-anchor="middle">按账号匹配</text>
  <text x="780" y="486" font-size="16" fill="#2a2723" text-anchor="middle">推荐题材</text>

  <!-- col4 -->
  <g filter="url(#shadow)">
    <rect x="960" y="293" width="240" height="54" rx="9" fill="#efeaf1" stroke="#6d5a75" stroke-width="1.4"/>
    <rect x="960" y="373" width="240" height="54" rx="9" fill="#efeaf1" stroke="#6d5a75" stroke-width="1.4"/>
    <rect x="960" y="453" width="240" height="54" rx="9" fill="#efeaf1" stroke="#6d5a75" stroke-width="1.4"/>
  </g>
  <text x="1080" y="326" font-size="16" fill="#2a2723" text-anchor="middle">终审校对</text>
  <text x="1080" y="406" font-size="16" fill="#2a2723" text-anchor="middle">多平台版本</text>
  <text x="1080" y="486" font-size="16" fill="#2a2723" text-anchor="middle">口播提示</text>

  <!-- col5 -->
  <g filter="url(#shadow)">
    <rect x="1260" y="293" width="240" height="54" rx="9" fill="#e9efe9" stroke="#55705c" stroke-width="1.4"/>
    <rect x="1260" y="373" width="240" height="54" rx="9" fill="#e9efe9" stroke="#55705c" stroke-width="1.4"/>
    <rect x="1260" y="453" width="240" height="54" rx="9" fill="#e9efe9" stroke="#55705c" stroke-width="1.4"/>
  </g>
  <text x="1380" y="326" font-size="16" fill="#2a2723" text-anchor="middle">登录与游客</text>
  <text x="1380" y="406" font-size="16" fill="#2a2723" text-anchor="middle">Admin / Eval</text>
  <text x="1380" y="486" font-size="16" fill="#2a2723" text-anchor="middle">模型与降级</text>
</svg>
</body>
</html>
